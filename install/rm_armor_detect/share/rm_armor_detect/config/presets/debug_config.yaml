# 调试模式装甲板检测配置
# 适用于参数调优和问题排查

/video_subscriber_node:
  ros__parameters:
    # 基础参数
    topic_name: "image_raw"
    display_image: true
    window_name: "调试模式 - 装甲板检测"
    use_sensor_data_qos: true
    
    # 曝光增强
    enable_exposure_enhancement: true
    exposure_gain: 0.7
    
    # 车辆检测 - 调试模式降低阈值以检测更多目标
    enable_car_detection: true
    model_path: "~/code/src/rm_armor_detect/models/car/car.onnx"
    detection_confidence_threshold: 0.01
    
    # 数字分类 - 调试模式降低阈值
    enable_number_classification: true
    number_model_path: "~/code/src/rm_armor_detect/models/number/mlp.onnx"
    number_label_path: "~/code/src/rm_armor_detect/models/number/label.txt"
    number_confidence_threshold: 0.3
    
    # 二值化阈值 - 中等值便于观察
    binary_threshold: 150
    detect_color: 1
    debug_contours: true  # 开启调试模式
    
    # 灯条参数 - 放宽限制以检测更多潜在灯条
    light_params:
      min_ratio: 0.05
      max_ratio: 0.8
      max_angle: 60.0
    
    # 装甲板参数 - 放宽限制以检测更多潜在装甲板
    armor_params:
      min_light_ratio: 0.5
      min_small_center_distance: 0.5
      max_small_center_distance: 4.0
      min_large_center_distance: 3.0
      max_large_center_distance: 7.0
      max_angle: 50.0 